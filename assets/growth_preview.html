<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
  :root { --line:#e2e2e2; --hl:#b45309; }
  body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       margin:24px; color:#222; background:#faf7f2;}
  h1{font-size:20px;} h2{font-size:14px;color:#666;font-weight:600;}
  .bar{display:flex;gap:8px;align-items:center;margin:12px 0;}
  input,button{font-size:14px;padding:6px 10px;border-radius:6px;border:1px solid #ccc;}
  button{background:#b45309;color:#fff;border:none;cursor:pointer;font-weight:600;}
  button:hover{background:#92400e;}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:10px 0;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);}
  th{color:#777;font-weight:600;white-space:nowrap;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .notice{color:#999;font-size:12px;font-style:italic;}
  .empty{color:#999;font-style:italic;}
  .err{color:#c62828;font-weight:600;}
  .up{color:#2e7d32;} .down{color:#c62828;} .flat{color:#999;}
  canvas{width:100%;max-width:640px;display:block;margin:8px auto;}
</style>
</head>
<body>
  <h1>能力成长曲线 · 前端最小原型（v2.6 · P7）</h1>
  <p class="notice">独立预览页（不改 dashboard 核心逻辑）：<code>fetch("/api/trend")</code> 调通 +
  周均值折线 + 趋势卡。实现阶段把此逻辑内联进 <code>PAGE_TEMPLATE</code> 对应视图（nav 新增 growth）。</p>

  <div class="bar">
    <label>周数</label><input id="weeks" type="number" value="8" min="1" max="52" style="width:90px">
    <label>端口</label><input id="port" type="number" value="8765" style="width:90px">
    <label>Token(可选)</label><input id="token" type="password" style="width:160px">
    <button id="load">加载走势</button>
  </div>

  <div id="meta" class="card notice"></div>
  <h2>周均值折线（focus / quality · 0-100；产出柱状右轴）</h2>
  <div id="chart" class="card"><canvas id="chartCanvas" width="720" height="360"></canvas></div>
  <h2>趋势卡</h2>
  <div id="trend" class="card empty">数据加载后显示</div>

<script>
  document.getElementById('load').addEventListener('click', async () => {
    const weeks = document.getElementById('weeks').value || 8;
    const port  = document.getElementById('port').value || 8765;
    const token = document.getElementById('token').value.trim();
    const head  = token ? {'X-Dashboard-Token': token} : {};
    const url = `/api/trend?weeks=${encodeURIComponent(weeks)}`;
    const meta = document.getElementById('meta');
    const trd  = document.getElementById('trend');
    try {
      const r = await fetch(`http://127.0.0.1:${port}` + url, {headers:head});
      const d = await r.json();
      if (!r.ok) { meta.textContent=''; trd.innerHTML=`<span class="err">HTTP ${r.status}: ${d.error||JSON.stringify(d)}</span>`; return; }
      meta.textContent = `来源: ${d.source||'fresh'} · 更新: ${d.updated_at||'-'} · ${d.notice||''}`;
      if (!d.weeks || !d.weeks.length) { trd.innerHTML='<span class="empty">无数据（空态 200）</span>'; return; }
      renderChart(d.weeks);
      renderTrend(d.trend||[]);
    } catch(e) { meta.textContent=''; trd.innerHTML=`<span class="err">请求失败: ${e}</span>`; }
  });

</script>
</body>
</html>
